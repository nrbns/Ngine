name: Supabase Integration Check

on:
  workflow_dispatch:

jobs:
  supabase-check:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Check supabase connection
        run: node scripts/check_supabase.js
      - name: Run supabase tests (optional)
        run: |
          if [ -n "${EXPO_PUBLIC_SUPABASE_URL}" ] && [ -n "${EXPO_PUBLIC_SUPABASE_KEY}" ]; then
            echo "Running supabase tests...";
            npx jest components/__tests__/ProofGallery.supabase.test.tsx --runInBand --testTimeout=30000;
          else
            echo "Supabase env not present — skipping supabase tests.";
          fi
